input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["vehicle-positions"]
    group_id => "logstash-vehicle-positions"
    codec => "json"
  }
}

filter {
  # Vehicles with no route_id are off-trip (deadheading/out of service) -
  # nothing useful to show or color on the map, so drop them here.
  if [route_id] == "" {
    drop {}
  }

  # Enrichment: translate a bare route_id into human-readable fields using
  # the dictionaries built from static GTFS (ingestion/build_route_lookup.py).
  # translate maps exactly one key to one value, so each field gets its own
  # dictionary file.
  translate {
    field => "route_id"
    destination => "route_short_name"
    dictionary_path => "/usr/share/logstash/lookups/route_short_name.yml"
    fallback => "%{route_id}"
  }
  translate {
    field => "route_id"
    destination => "route_color"
    dictionary_path => "/usr/share/logstash/lookups/route_color.yml"
    fallback => "unknown"
  }
  translate {
    field => "route_id"
    destination => "route_type"
    dictionary_path => "/usr/share/logstash/lookups/route_type.yml"
    fallback => "unknown"
  }

  # Elasticsearch's geo_point mapping expects a single field shaped like
  # {"lat": ..., "lon": ...} - not two separate flat fields.
  mutate {
    rename => { "lat" => "[location][lat]" }
    rename => { "lon" => "[location][lon]" }
    convert => { "timestamp" => "integer" }
  }

  date {
    match => ["timestamp", "UNIX"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "vehicle-positions"
  }
}
