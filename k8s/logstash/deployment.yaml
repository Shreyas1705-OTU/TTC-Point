apiVersion: apps/v1
kind: Deployment

metadata:
  name: logstash
  namespace: ttcpoint

spec:
  replicas: 1

  selector:
    matchLabels:
      app: logstash

  template:
    metadata:
      labels:
        app: logstash

    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:9.5.4

          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: lookups
              mountPath: /usr/share/logstash/lookups

      # These three ConfigMaps are generated from the repo's source files
      # (logstash/pipeline/, logstash/config/, data/lookups/) by
      # scripts/deploy-kind.sh, rather than duplicated here by hand -
      # keeps one source of truth instead of two copies drifting apart.
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
        - name: config
          configMap:
            name: logstash-config
        - name: lookups
          configMap:
            name: route-lookups
