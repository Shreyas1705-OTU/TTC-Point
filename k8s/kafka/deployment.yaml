apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka
  namespace: ttcpoint

spec:
  # Single broker - this demonstrates the streaming pattern, not a
  # highly-available Kafka cluster. Never scale this up: KRaft's
  # controller quorum config below assumes exactly one node.
  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      containers:
        - name: kafka
          image: apache/kafka:latest

          ports:
            - containerPort: 29092

          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            # Unlike docker-compose (which needed separate host vs.
            # container-network listeners), every consumer here is a pod -
            # one listener is enough. Kept on port 29092 (not 9092) so the
            # exact same logstash/pipeline/vehicle-positions.conf
            # (bootstrap_servers => "kafka:29092") works unchanged in both
            # docker-compose and k8s - it's shared via bind-mount in one,
            # a generated ConfigMap in the other, with no per-environment
            # templating.
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:29092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:29092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:29092
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:29092
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
